<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <radialGradient id="atomGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffb74d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff9800;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="#0d0d14" stroke="#ffb74d" stroke-width="1"/>
  
  <!-- Nucleus -->
  <circle cx="16" cy="16" r="4" fill="url(#atomGradient)"/>
  
  <!-- Electron orbits -->
  <ellipse cx="16" cy="16" rx="12" ry="4" fill="none" stroke="#ffb74d" stroke-width="1" opacity="0.6" transform="rotate(0 16 16)"/>
  <ellipse cx="16" cy="16" rx="12" ry="4" fill="none" stroke="#ffb74d" stroke-width="1" opacity="0.6" transform="rotate(60 16 16)"/>
  <ellipse cx="16" cy="16" rx="12" ry="4" fill="none" stroke="#ffb74d" stroke-width="1" opacity="0.6" transform="rotate(120 16 16)"/>
  
  <!-- Electrons -->
  <circle cx="28" cy="16" r="1.5" fill="#ffd280"/>
  <circle cx="10" cy="8" r="1.5" fill="#ffd280"/>
  <circle cx="10" cy="24" r="1.5" fill="#ffd280"/>
</svg>
