name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          echo "Checking _site directory structure..."
          ls -la _site/
          echo "Checking if styles.css exists..."
          test -f _site/styles.css && echo "styles.css found" || echo "styles.css NOT found"
          echo "Checking index.html..."
          head -20 _site/index.html
          echo "Checking ciencia directory..."
          ls -la _site/ciencia/
          echo "Checking ciencia/index.html..."
          test -f _site/ciencia/index.html && echo "ciencia/index.html found" || echo "ciencia/index.html NOT found"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4